<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>OBS Overlay Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
        }

        .lower-third {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 350px;
            display: none;
            pointer-events: none;
        }

        .lower-third.visible { display: block; }

        .background-shapes {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .shape-1 {
            position: absolute;
            bottom: -50px;
            left: -100px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(60px);
        }

        .shape-2 {
            position: absolute;
            bottom: -80px;
            left: 400px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(50px);
        }

        .overlay-content {
            position: absolute;
            bottom: 80px;
            left: 100px;
            max-width: 1600px;
            max-height: 280px;
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 0;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            width: fit-content;
        }

        .accent-stripe {
            position: absolute;
            left: 0;
            top: 0;
            width: 8px;
            height: 100%;
        }

        .content-wrapper {
            padding: 30px 40px 30px 60px;
            position: relative;
            max-height: 280px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .church-label {
            display: inline-block;
            font-size: clamp(10px, 0.8vw, 12px);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding: 6px 12px;
            border-radius: 6px;
            flex-shrink: 0;
            width: fit-content;
            max-width: 90%;
        }

        .main-title {
            font-size: clamp(28px, 3.5vw, 50px);
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            max-width: 1400px;
            flex-shrink: 1;
        }

        .subtitle {
            font-size: clamp(18px, 2vw, 28px);
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: -0.5px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 1400px;
            margin-bottom: 6px;
            flex-shrink: 1;
        }

        .bible-verse {
            font-size: clamp(16px, 1.5vw, 22px);
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 1400px;
            flex-shrink: 0;
        }

        .corner-decoration {
            position: absolute;
            top: -1px;
            right: -1px;
            width: 120px;
            height: 120px;
            border-radius: 0 24px 0 0;
        }

        .corner-decoration::before {
            content: '';
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 0 8px 0 0;
        }

        .bottom-glow {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            opacity: 0.6;
        }

        #connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 10px;
            border-radius: 4px;
            z-index: 9999;
            font-family: monospace;
        }

        #connection-status.connected    { background: rgba(16, 185, 129, 0.8); }
        #connection-status.disconnected { background: rgba(239, 68, 68, 0.8); }
        #connection-status.connecting   { background: rgba(251, 191, 36, 0.8); }

        /* ── Animations ─────────────────────────────────────────────────── */
        @keyframes slideUp {
            from { transform: translateY(120px); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }
        .anim-slide-up .overlay-content { animation: slideUp 2s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1);    }
        }
        .anim-fade-in .overlay-content { animation: fadeIn 2s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes slideLeft {
            from { transform: translateX(-150px); opacity: 0; }
            to   { transform: translateX(0);      opacity: 1; }
        }
        .anim-slide-left .overlay-content { animation: slideLeft 2s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes slideDown {
            from { transform: translateY(-150px); opacity: 0; }
            to   { transform: translateY(0);      opacity: 1; }
        }
        .anim-slide-down .overlay-content { animation: slideDown 2s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .anim-zoom-in .overlay-content { animation: zoomIn 1.8s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes bounceIn {
            0%   { transform: translateY(150px) scale(0.95); opacity: 0; }
            60%  { transform: translateY(-15px)  scale(1.02); opacity: 1; }
            100% { transform: translateY(0)      scale(1);    opacity: 1; }
        }
        .anim-bounce-in .overlay-content { animation: bounceIn 2.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .anim-typewriter .church-label,
        .anim-typewriter .main-title,
        .anim-typewriter .subtitle,
        .anim-typewriter .bible-verse { opacity: 0; }
        .anim-typewriter .church-label.typing,
        .anim-typewriter .main-title.typing,
        .anim-typewriter .subtitle.typing,
        .anim-typewriter .bible-verse.typing { opacity: 1; }
        .anim-typewriter .church-label.typed,
        .anim-typewriter .main-title.typed,
        .anim-typewriter .subtitle.typed,
        .anim-typewriter .bible-verse.typed { opacity: 1; }
        .anim-typewriter .church-label.typing::after,
        .anim-typewriter .main-title.typing::after,
        .anim-typewriter .subtitle.typing::after,
        .anim-typewriter .bible-verse.typing::after {
            content: '|';
            animation: blink 0.7s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        @keyframes waveIn {
            0%   { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0);     }
        }
        .anim-wave-in .church-label { animation: waveIn 1.6s cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0s;    }
        .anim-wave-in .main-title   { animation: waveIn 1.6s cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.35s; }
        .anim-wave-in .subtitle     { animation: waveIn 1.6s cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.7s;  }
        .anim-wave-in .bible-verse  { animation: waveIn 1.6s cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 1.0s;  }

        @keyframes glitch {
            0%,100% { transform: translate(0); }
            20%     { transform: translate(-3px, 3px); }
            40%     { transform: translate(-3px,-3px); }
            60%     { transform: translate( 3px, 3px); }
            80%     { transform: translate( 3px,-3px); }
        }
        @keyframes glitchColor {
            0%,100% { text-shadow: 0 4px 12px rgba(0,0,0,0.4); }
            25%     { text-shadow: -3px 0 var(--accent-color), 3px 0 #3b82f6, 0 4px 12px rgba(0,0,0,0.4); }
            75%     { text-shadow:  3px 0 var(--accent-color),-3px 0 #3b82f6, 0 4px 12px rgba(0,0,0,0.4); }
        }
        .anim-glitch .main-title { animation: glitch 0.4s ease-in-out 3, glitchColor 0.4s ease-in-out 3; }

        @keyframes reveal {
            from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
            to   { clip-path: polygon(0 0,100% 0,100% 100%, 0 100%); }
        }
        .anim-reveal .overlay-content { animation: reveal 2.2s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes slideRight {
            from { transform: translateX(150px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }
        .anim-slide-right .overlay-content { animation: slideRight 2s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes rotateIn {
            from { transform: rotate(-180deg) scale(0); opacity: 0; }
            to   { transform: rotate(0)       scale(1); opacity: 1; }
        }
        .anim-rotate-in .overlay-content { animation: rotateIn 2.2s cubic-bezier(0.16, 1, 0.3, 1); }

        .anim-none .overlay-content { animation: none; }

        @keyframes glowPulse {
            0%,100% { box-shadow: 0 0 20px rgba(var(--accent-rgb),0.3); }
            50%     { box-shadow: 0 0 40px rgba(var(--accent-rgb),0.6); }
        }
        .accent-stripe { animation: glowPulse 3s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="connection-status" class="connecting">Connecting...</div>

    <div id="lower-third" class="lower-third">
        <div class="background-shapes">
            <div class="shape-1"></div>
            <div class="shape-2"></div>
        </div>
        <div class="overlay-content">
            <div class="accent-stripe"></div>
            <div class="corner-decoration"></div>
            <div class="content-wrapper">
                <div class="church-label" id="church-info"></div>
                <div class="main-title"   id="main-title"></div>
                <div class="subtitle"     id="subtitle"></div>
                <div class="bible-verse"  id="bible-verse"></div>
            </div>
            <div class="bottom-glow"></div>
        </div>
    </div>

    <script>
        // ── DOM refs ──────────────────────────────────────────────────────
        const lowerThird       = document.getElementById('lower-third');
        const churchInfo       = document.getElementById('church-info');
        const mainTitle        = document.getElementById('main-title');
        const subtitle         = document.getElementById('subtitle');
        const bibleVerse       = document.getElementById('bible-verse');
        const connectionStatus = document.getElementById('connection-status');

        // ── Runtime state ─────────────────────────────────────────────────
        let currentState       = null;   // last applied full state object
        let currentVersion     = -1;
        let autoInterval       = null;   // setInterval handle for auto-rotation
        let autoTimeout        = null;   // spare setTimeout for auto tick
        let typewriterTimeouts = [];
        let sceneActive        = false;  // true while sceneSwitch is mid-transition

        // ── Animation class map ───────────────────────────────────────────
        const animationClasses = {
            'none':        'anim-none',
            'slide-up':    'anim-slide-up',
            'fade-in':     'anim-fade-in',
            'slide-left':  'anim-slide-left',
            'slide-right': 'anim-slide-right',
            'slide-down':  'anim-slide-down',
            'zoom-in':     'anim-zoom-in',
            'bounce-in':   'anim-bounce-in',
            'rotate-in':   'anim-rotate-in',
            'typewriter':  'anim-typewriter',
            'wave-in':     'anim-wave-in',
            'glitch':      'anim-glitch',
            'reveal':      'anim-reveal'
        };

        const DEFAULT_ANIMATIONS = [
            'slide-up','fade-in','slide-left','slide-right','slide-down',
            'zoom-in','bounce-in','rotate-in','wave-in','reveal','typewriter','glitch'
        ];

        // ── Helpers ───────────────────────────────────────────────────────

        function hexToRgb(hex) {
            const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return r ? `${parseInt(r[1],16)}, ${parseInt(r[2],16)}, ${parseInt(r[3],16)}` : '16, 185, 129';
        }

        function applyColors(colors) {
            if (!colors) return;
            const ac  = colors.accent || '#10b981';
            const rgb = hexToRgb(ac);
            document.documentElement.style.setProperty('--accent-color', ac);
            document.documentElement.style.setProperty('--accent-rgb', rgb);
            const stripe = document.querySelector('.accent-stripe');
            if (stripe) stripe.style.background =
                `linear-gradient(180deg, ${ac} 0%, ${ac}dd 50%, ${ac}bb 100%)`;
            document.querySelectorAll('.shape-1, .shape-2').forEach((s, i) => {
                const op = i === 0 ? ['0.15','0.08'] : ['0.12','0.06'];
                s.style.background =
                    `linear-gradient(135deg, rgba(${rgb},${op[0]}) 0%, rgba(${rgb},${op[1]}) 100%)`;
            });
            if (churchInfo) {
                churchInfo.style.color       = colors.church_label || '#10b981';
                churchInfo.style.background  = `rgba(${rgb}, 0.1)`;
                churchInfo.style.borderColor = `rgba(${rgb}, 0.2)`;
            }
            if (mainTitle)  mainTitle.style.color  = colors.main_title || '#ffffff';
            if (subtitle)   subtitle.style.color   = colors.subtitle   || 'rgba(255,255,255,0.85)';
            if (bibleVerse) bibleVerse.style.color  = colors.verse      || '#10b981';
            const cd = document.querySelector('.corner-decoration');
            if (cd) cd.style.background =
                `linear-gradient(135deg, rgba(${rgb},0.15) 0%, transparent 60%)`;
            try {
                document.styleSheets[0].insertRule(
                    `.corner-decoration::before { border-top-color: rgba(${rgb},0.4) !important; border-right-color: rgba(${rgb},0.4) !important; }`, 0);
                document.styleSheets[0].insertRule(
                    `.anim-typewriter .church-label.typing::after,
                     .anim-typewriter .main-title.typing::after,
                     .anim-typewriter .subtitle.typing::after,
                     .anim-typewriter .bible-verse.typing::after { color: ${ac} !important; }`, 0);
            } catch(e) {}
            const bg = document.querySelector('.bottom-glow');
            if (bg) bg.style.background =
                `linear-gradient(90deg, transparent 0%, ${ac} 20%, ${ac}dd 50%, ${ac} 80%, transparent 100%)`;
        }

        // Write DOM content from state — always resets all fields first
        function applyContent(state) {
            mainTitle.textContent    = '';
            subtitle.textContent     = '';
            subtitle.style.display   = 'none';
            bibleVerse.textContent   = '';
            bibleVerse.style.display = 'none';

            if (state.church) {
                churchInfo.textContent  = (state.church.description && state.church.description.trim())
                    ? state.church.name + ' \u2022 ' + state.church.description
                    : state.church.name;
                churchInfo.style.display = 'inline-block';
            } else {
                churchInfo.style.display = 'none';
            }

            if (state.mode === 'minister' && state.minister) {
                mainTitle.textContent  = state.minister.name;
                subtitle.textContent   = state.minister.title || '';
                subtitle.style.display = state.minister.title ? 'block' : 'none';
            } else if (state.mode === 'sermon' && state.sermon) {
                mainTitle.textContent  = state.sermon.title;
                subtitle.textContent   = state.sermon.minister_name || '';
                subtitle.style.display = state.sermon.minister_name ? 'block' : 'none';
                if (state.sermon.bible_verse) {
                    bibleVerse.textContent   = state.sermon.bible_verse;
                    bibleVerse.style.display = 'block';
                }
            }
        }

        // Remove all animation CSS classes from lowerThird
        function clearAnimClasses() {
            Object.values(animationClasses).forEach(cls => lowerThird.classList.remove(cls));
        }

        // Remove inline transition/transform/opacity set by sceneSwitch
        function clearInlineStyles() {
            const oc = document.querySelector('.overlay-content');
            oc.style.transition = '';
            oc.style.transform  = '';
            oc.style.opacity    = '';
        }

        // ── Typewriter effect ─────────────────────────────────────────────

        function clearTypewriterTimeouts() {
            typewriterTimeouts.forEach(t => clearTimeout(t));
            typewriterTimeouts = [];
        }

        function typewriterEffect(el, text, speed) {
            return new Promise(resolve => {
                el.textContent = '';
                el.classList.add('typing');
                el.classList.remove('typed');
                let i = 0;
                function type() {
                    if (i < text.length) {
                        el.textContent += text.charAt(i++);
                        typewriterTimeouts.push(setTimeout(type, speed));
                    } else {
                        el.classList.remove('typing');
                        el.classList.add('typed');
                        resolve();
                    }
                }
                type();
            });
        }

        async function runTypewriter() {
            clearTypewriterTimeouts();
            [churchInfo, mainTitle, subtitle, bibleVerse].forEach(el => el.classList.remove('typing','typed'));
            const items = [];
            if (churchInfo.style.display !== 'none' && churchInfo.textContent)
                items.push({ el: churchInfo, speed: 55 });
            if (mainTitle.textContent)
                items.push({ el: mainTitle,  speed: 70 });
            if (subtitle.style.display !== 'none' && subtitle.textContent)
                items.push({ el: subtitle,   speed: 60 });
            if (bibleVerse.style.display !== 'none' && bibleVerse.textContent)
                items.push({ el: bibleVerse, speed: 55 });
            for (const { el, speed } of items) {
                await typewriterEffect(el, el.textContent, speed);
            }
        }

        // ── Build a clean animation pool from settings ────────────────────
        // Filters out empty strings and names that have no CSS class defined.
        function buildPool(animSettings) {
            if (!animSettings) return DEFAULT_ANIMATIONS;
            const raw = animSettings.enabled_animations;
            if (!raw || raw.length === 0) return DEFAULT_ANIMATIONS;
            // raw may be an array (from Python .split(',')) or a comma-string
            const list = Array.isArray(raw) ? raw : raw.split(',');
            const clean = list.map(s => s.trim()).filter(s => s && animationClasses[s]);
            return clean.length > 0 ? clean : DEFAULT_ANIMATIONS;
        }

        function pickRandom(pool) {
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // ── Apply one named animation to lowerThird ───────────────────────
        // Hides overlay, then shows it with the chosen animation class.
        // Does NOT touch autoInterval — caller manages that.
        function playAnimation(name) {
            clearAnimClasses();
            clearTypewriterTimeouts();
            clearInlineStyles();
            lowerThird.classList.remove('visible');

            setTimeout(() => {
                const cls = animationClasses[name];
                if (cls) lowerThird.classList.add(cls);
                lowerThird.classList.add('visible');
                if (name === 'typewriter') setTimeout(runTypewriter, 100);
            }, 50);
        }

        // ── Stop auto-rotation ────────────────────────────────────────────
        function stopAuto() {
            if (autoInterval) { clearInterval(autoInterval);  autoInterval = null; }
            if (autoTimeout)  { clearTimeout(autoTimeout);    autoTimeout  = null; }
        }

        // ── Start (or restart) auto-rotation ─────────────────────────────
        //
        // This is the ONLY function that manages autoInterval.
        // It always cancels the existing timer first, then:
        //
        //   playNow=true  → play one animation immediately, then set interval
        //   playNow=false → just set a new interval (don't disturb current display)
        //
        // Use playNow=false when only the interval/pool changed while the overlay
        // was already showing — avoids a flicker/re-entrance animation mid-display.
        //
        function startAuto(animSettings, playNow) {
            stopAuto();

            // Nothing to do if auto_rotate is off
            if (!animSettings || !animSettings.auto_rotate) return;

            // Nothing to do if overlay is hidden
            if (!currentState || currentState.mode === 'hidden') return;

            const pool     = buildPool(animSettings);
            const interval = Math.max((animSettings.rotation_interval || 5), 1) * 1000;

            if (playNow) {
                playAnimation(pickRandom(pool));
            }

            autoInterval = setInterval(() => {
                if (!currentState || currentState.mode === 'hidden') {
                    stopAuto();
                    return;
                }
                playAnimation(pickRandom(pool));
            }, interval);
        }

        // ── Snapshot key for detecting animation_settings changes ─────────
        function settingsKey(animSettings) {
            if (!animSettings) return '';
            const pool = buildPool(animSettings);
            return `${animSettings.auto_rotate}|${animSettings.rotation_interval}|${pool.join(',')}`;
        }

        // ── Scene switch: slide out old, swap content, slide in new ───────
        function sceneSwitch(newState, onComplete) {
            if (sceneActive) {
                // Already mid-transition — snap to new state immediately
                clearInlineStyles();
                applyContent(newState);
                sceneActive = false;
                if (onComplete) onComplete();
                return;
            }
            sceneActive = true;
            const oc = document.querySelector('.overlay-content');
            clearInlineStyles();
            oc.getBoundingClientRect(); // force reflow

            oc.style.transition = 'transform 0.38s cubic-bezier(0.4,0,1,1), opacity 0.38s ease';
            oc.style.transform  = 'translateY(32px)';
            oc.style.opacity    = '0';

            setTimeout(() => {
                applyContent(newState);
                oc.style.transition = 'none';
                oc.style.transform  = 'translateY(-24px)';
                oc.style.opacity    = '0';
                oc.getBoundingClientRect(); // force reflow
                oc.style.transition = 'transform 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.45s cubic-bezier(0.16,1,0.3,1)';
                oc.style.transform  = 'translateY(0)';
                oc.style.opacity    = '1';
                setTimeout(() => {
                    clearInlineStyles();
                    sceneActive = false;
                    if (onComplete) onComplete();
                }, 510);
            }, 400);
        }

        // ── shouldUpdate guard ────────────────────────────────────────────
        function shouldUpdate(s) {
            if (!currentState) return true;
            if (s.version !== undefined && s.version > currentVersion) return true;
            return JSON.stringify(currentState) !== JSON.stringify(s);
        }

        // ═══════════════════════════════════════════════════════════════════
        // MAIN UPDATE FUNCTION
        //
        // Called on every SSE event (init / update).
        //
        // Decision tree:
        //   A. mode === 'hidden'              → hide everything, stop auto
        //   B. First show / from hidden       → write content, start animation mode
        //   C. Content changed while live     → sceneSwitch, then resume animation mode
        //   D. Only animation field changed   → replay explicit OR restart auto (playNow)
        //   E. Only animation_settings changed→ if auto mode: restart interval (no flicker)
        //                                       if explicit mode: no visible change needed
        //   F. Color/church-only update       → recolor, no animation restart
        // ═══════════════════════════════════════════════════════════════════
        function updateDisplay(state) {
            if (!state) return;
            if (!shouldUpdate(state)) return;

            const isFirstLoad = (currentState === null);
            const wasHidden   = !currentState || currentState.mode === 'hidden';

            // ── Compute diffs BEFORE committing new state ─────────────────
            const prevAnim     = currentState ? (currentState.animation || 'auto') : 'auto';
            const prevSettings = currentState ? settingsKey(currentState.animation_settings) : '';

            const prevContentKey = currentState
                ? JSON.stringify({ mode: currentState.mode, m: currentState.minister, s: currentState.sermon })
                : null;
            const newContentKey = JSON.stringify({ mode: state.mode, m: state.minister, s: state.sermon });

            const contentChanged  = prevContentKey !== newContentKey;
            const newAnim         = state.animation || 'auto';
            const animChanged     = prevAnim !== newAnim;
            const newSettings     = settingsKey(state.animation_settings);
            const settingsChanged = prevSettings !== newSettings;

            // ── Commit state ──────────────────────────────────────────────
            currentState = state;
            if (state.version !== undefined) currentVersion = state.version;
            if (state.colors) applyColors(state.colors);

            // Resolved animation mode:
            //   'auto'     → auto-rotation using animation_settings
            //   'none'     → show with no animation
            //   anything else → play that specific animation once, no interval
            const isExplicit = (newAnim !== 'auto' && newAnim !== 'none');
            const animSettings = state.animation_settings || null;

            // ── A. Hidden ─────────────────────────────────────────────────
            if (state.mode === 'hidden') {
                lowerThird.classList.remove('visible');
                stopAuto();
                clearAnimClasses();
                clearInlineStyles();
                return;
            }

            // Helper called after any transition to settle into the correct mode
            function settle() {
                if (isExplicit) {
                    stopAuto();
                    playAnimation(newAnim);
                } else if (newAnim === 'none') {
                    stopAuto();
                    clearAnimClasses();
                    clearInlineStyles();
                    lowerThird.classList.add('visible');
                } else {
                    // auto — play immediately and start interval
                    startAuto(animSettings, true);
                }
            }

            // ── B. First show / coming out of hidden ──────────────────────
            if (isFirstLoad || wasHidden) {
                applyContent(state);
                settle();
                return;
            }

            // ── C. Content changed while live ─────────────────────────────
            if (contentChanged) {
                stopAuto();
                sceneSwitch(state, () => settle());
                return;
            }

            // ── D. Animation field changed (same content) ─────────────────
            // e.g. user switched from 'slide-up' → 'auto', or 'auto' → 'fade-in'
            if (animChanged) {
                stopAuto();
                clearAnimClasses();
                clearInlineStyles();
                if (isExplicit) {
                    playAnimation(newAnim);
                } else if (newAnim === 'none') {
                    lowerThird.classList.add('visible');
                } else {
                    // Switching into auto — play one immediately and start interval
                    startAuto(animSettings, true);
                }
                return;
            }

            // ── E. animation_settings changed (admin saved settings) ──────
            //
            // This is the previously broken case. We now handle it explicitly.
            //
            // Two sub-cases:
            //   E1. auto_rotate just turned OFF → stop interval, keep overlay visible
            //   E2. In auto mode and settings changed → restart with new interval/pool
            //       Use playNow=false to avoid a hide-show flicker since the overlay
            //       is already visible with a valid animation showing.
            //   E3. In explicit mode → settings don't affect current display;
            //       new settings will take effect next time auto mode is entered.
            //
            if (settingsChanged) {
                if (!isExplicit && newAnim !== 'none') {
                    // We are in auto mode
                    if (!animSettings || !animSettings.auto_rotate) {
                        // E1: auto_rotate was just turned off — stop the interval,
                        //     but leave the overlay exactly as it is (no flicker).
                        stopAuto();
                    } else {
                        // E2: interval or pool changed — restart with new values.
                        //     playNow=false: don't replay the animation, just reset the timer.
                        startAuto(animSettings, false);
                    }
                }
                // E3: explicit mode — nothing to do, already handled above.
                return;
            }

            // ── F. Color / church / other metadata only ───────────────────
            // applyColors already ran above. No animation restart needed.
            // (auto interval keeps ticking unchanged)
        }

        // ── Polling (replaces SSE -- shared hosting incompatible with streaming) ──
        let pollTimer    = null;
        let pollFailures = 0;

        function updateConnectionStatus(status, message) {
            connectionStatus.className   = status;
            connectionStatus.textContent = message;
        }

        async function poll() {
            try {
                const res   = await fetch('/api/overlay/state');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const state = await res.json();
                pollFailures = 0;
                updateConnectionStatus('connected', 'Connected (v' + (state.version || currentVersion) + ')');
                updateDisplay(state);
            } catch (e) {
                pollFailures++;
                const msg = pollFailures > 3 ? 'Connection lost. Retrying...' : 'Connecting...';
                updateConnectionStatus(pollFailures > 3 ? 'disconnected' : 'connecting', msg);
            }
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            poll();                              // immediate first fetch
            pollTimer = setInterval(poll, 1500); // then every 1.5 s
        }

        startPolling();

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) { poll(); }
        });

        window.addEventListener('beforeunload', () => {
            if (pollTimer) clearInterval(pollTimer);
            stopAuto();
        });

        // Hide the connection status indicator after 3 s once connected
        setTimeout(() => {
            if (connectionStatus.classList.contains('connected'))
                connectionStatus.style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
