<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>OBS Overlay Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
        }

        .lower-third {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 350px;
            display: none;
            pointer-events: none;
        }
        .lower-third.visible { display: block; }

        .background-shapes {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; overflow: hidden;
        }
        .shape-1 {
            position: absolute; bottom: -50px; left: -100px;
            width: 600px; height: 600px; border-radius: 50%; filter: blur(60px);
        }
        .shape-2 {
            position: absolute; bottom: -80px; left: 400px;
            width: 400px; height: 400px; border-radius: 50%; filter: blur(50px);
        }

        .overlay-content {
            position: absolute; bottom: 80px; left: 100px;
            max-width: 1600px; max-height: 420px;
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 0; border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
            overflow: hidden; width: fit-content;
        }

        .accent-stripe {
            position: absolute; left: 0; top: 0; width: 8px; height: 100%;
            animation: glowPulse 3s ease-in-out infinite;
        }

        .content-wrapper {
            padding: 30px 40px 30px 60px; position: relative;
            display: flex; flex-direction: column; justify-content: center;
        }

        .church-label {
            display: inline-block; font-size: clamp(10px, 0.8vw, 12px);
            font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 10px; padding: 6px 12px; border-radius: 6px;
            flex-shrink: 0; width: fit-content; max-width: 90%;
        }
        .main-title {
            font-size: clamp(28px, 3.5vw, 50px); font-weight: 800;
            margin-bottom: 8px; line-height: 1.1; letter-spacing: -1px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
            word-wrap: break-word; overflow-wrap: break-word; hyphens: auto;
            max-width: 1400px; flex-shrink: 1;
        }
        .subtitle {
            font-size: clamp(18px, 2vw, 28px); font-weight: 500;
            line-height: 1.2; letter-spacing: -0.5px;
            word-wrap: break-word; overflow-wrap: break-word;
            max-width: 1400px; margin-bottom: 6px; flex-shrink: 1;
        }
        .bible-verse {
            font-size: clamp(16px, 1.5vw, 22px); margin-top: 8px;
            font-weight: 600; letter-spacing: 0.3px;
            word-wrap: break-word; overflow-wrap: break-word;
            max-width: 1400px; flex-shrink: 0;
        }

        /* ── Secondary Messages / Ticker ───────────────────────── */
        #main-content-area {
            position: relative;
            min-height: 90px;
        }
        #primary-block {
            transition: opacity 0.35s ease;
        }
        .secondary-msg {
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 1400px;
            width: 100%;
            transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.16,1,0.3,1);
        }
        /* ── Ticker enter states (before .tk-visible is added) ── */
        .secondary-msg.tk-enter-fade        { opacity: 0; transform: translateY(0); }
        .secondary-msg.tk-enter-slide-up    { opacity: 0; transform: translateY(24px); }
        .secondary-msg.tk-enter-slide-down  { opacity: 0; transform: translateY(-24px); }
        .secondary-msg.tk-enter-slide-left  { opacity: 0; transform: translateX(-40px); }
        .secondary-msg.tk-enter-slide-right { opacity: 0; transform: translateX(40px); }
        .secondary-msg.tk-enter-zoom        { opacity: 0; transform: scale(0.88); }
        .secondary-msg.tk-enter-blur        { opacity: 0; filter: blur(12px); transform: scale(1.04); }
        .secondary-msg.tk-enter-wipe-right  { opacity: 0; clip-path: inset(0 100% 0 0); }
        .secondary-msg.tk-enter-elastic     { opacity: 0; transform: translateY(32px) scaleY(0.7); }
        .secondary-msg.tk-enter-bounce      { opacity: 0; transform: translateY(40px) scale(0.9); }
        .secondary-msg.tk-enter-flip        { opacity: 0; transform: perspective(600px) rotateX(-60deg); }
        .secondary-msg.tk-enter-drop        { opacity: 0; transform: translateY(-30px) scaleY(0.85); }
        .secondary-msg.tk-enter-pop         { opacity: 0; transform: scale(0.6); }
        .secondary-msg.tk-enter-slam        { opacity: 0; transform: scale(1.4); }

        /* ── Visible state (all enter classes resolve to this) ── */
        .secondary-msg.tk-visible {
            opacity: 1 !important;
            transform: none !important;
            filter: none !important;
            clip-path: none !important;
        }
        .secondary-msg.tk-exit { opacity: 0 !important; }

        /* ── Typewriter / JS-driven ticker modes ── */
        .secondary-msg.tk-typewriter { opacity: 1; }
        .secondary-msg.tk-typewriter::after {
            content: '|';
            animation: blink 0.7s step-end infinite;
            margin-left: 2px;
        }
        .secondary-msg.tk-typewriter.tw-done::after { display: none; }

        /* wave-in stagger for ticker — each word slides in */
        @keyframes tkWaveWord {
            from { opacity: 0; transform: translateX(-20px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .secondary-msg.tk-wave span.tk-word {
            display: inline-block;
            opacity: 0;
            animation: tkWaveWord 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .secondary-msg.tk-wave.tk-visible span.tk-word { opacity: 1; }

        .corner-decoration {
            position: absolute; top: -1px; right: -1px; width: 120px; height: 120px;
            border-radius: 0 24px 0 0;
        }
        .corner-decoration::before {
            content: ''; position: absolute; top: 20px; right: 20px;
            width: 40px; height: 40px; border-radius: 0 8px 0 0;
        }

        .bottom-glow {
            position: absolute; bottom: 0; left: 0; right: 0; height: 2px; opacity: 0.6;
        }

        #connection-status {
            position: fixed; top: 10px; right: 10px;
            padding: 5px 10px; background: rgba(0,0,0,0.7); color: white;
            font-size: 10px; border-radius: 4px; z-index: 9999; font-family: monospace;
        }
        #connection-status.connected    { background: rgba(16,185,129,0.8); }
        #connection-status.disconnected { background: rgba(239,68,68,0.8); }
        #connection-status.connecting   { background: rgba(251,191,36,0.8); }

        /* ═══════════════════════════════════════════════════════════
           ENTRANCE ANIMATIONS — Container
        ═══════════════════════════════════════════════════════════ */

        @keyframes slideUp {
            from { transform: translateY(120px); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }
        .anim-slide-up .overlay-content {
            animation: slideUp var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1);    }
        }
        .anim-fade-in .overlay-content {
            animation: fadeIn var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes slideLeft {
            from { transform: translateX(-150px); opacity: 0; }
            to   { transform: translateX(0);      opacity: 1; }
        }
        .anim-slide-left .overlay-content {
            animation: slideLeft var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes slideRight {
            from { transform: translateX(200px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }
        .anim-slide-right .overlay-content {
            animation: slideRight var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes slideDown {
            from { transform: translateY(-150px); opacity: 0; }
            to   { transform: translateY(0);      opacity: 1; }
        }
        .anim-slide-down .overlay-content {
            animation: slideDown var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .anim-zoom-in .overlay-content {
            animation: zoomIn var(--anim-duration, 1.8s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes bounceIn {
            0%   { transform: translateY(150px) scale(0.95); opacity: 0; }
            60%  { transform: translateY(-15px) scale(1.02);  opacity: 1; }
            100% { transform: translateY(0)     scale(1);     opacity: 1; }
        }
        .anim-bounce-in .overlay-content {
            animation: bounceIn var(--anim-duration, 2.4s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes rotateIn {
            from { transform: rotate(-8deg) scale(0.9) translateY(60px); opacity: 0; }
            to   { transform: rotate(0)    scale(1)   translateY(0);     opacity: 1; }
        }
        .anim-rotate-in .overlay-content {
            animation: rotateIn var(--anim-duration, 2.2s) cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes reveal {
            from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
            to   { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }
        .anim-reveal .overlay-content {
            animation: reveal var(--anim-duration, 2.2s) cubic-bezier(0.16,1,0.3,1);
        }

        /* NEW: flip-in — 3D perspective flip on X */
        @keyframes flipIn {
            from { transform: perspective(800px) rotateX(-80deg) translateY(60px); opacity: 0; }
            to   { transform: perspective(800px) rotateX(0deg)   translateY(0);    opacity: 1; }
        }
        .anim-flip-in .overlay-content {
            animation: flipIn var(--anim-duration, 1.6s) cubic-bezier(0.16,1,0.3,1);
            transform-style: preserve-3d;
        }

        /* NEW: drop-in — falls with gravitational overshoot */
        @keyframes dropIn {
            0%   { transform: translateY(-200px) scaleY(0.85); opacity: 0; }
            65%  { transform: translateY(18px)   scaleY(1.04); opacity: 1; }
            82%  { transform: translateY(-8px)   scaleY(0.98); }
            100% { transform: translateY(0)      scaleY(1);    opacity: 1; }
        }
        .anim-drop-in .overlay-content {
            animation: dropIn var(--anim-duration, 1.8s) cubic-bezier(0.22,1,0.36,1);
        }

        /* NEW: split-in — clip-path opens from center */
        @keyframes splitIn {
            from { clip-path: inset(50% 0); opacity: 0.4; }
            to   { clip-path: inset(0% 0);  opacity: 1;   }
        }
        .anim-split-in .overlay-content {
            animation: splitIn var(--anim-duration, 1.4s) cubic-bezier(0.16,1,0.3,1);
        }

        /* NEW: pop-in — elastic scale pop */
        @keyframes popIn {
            0%   { transform: scale(0.5);  opacity: 0; }
            55%  { transform: scale(1.08); opacity: 1; }
            75%  { transform: scale(0.96); }
            100% { transform: scale(1);    opacity: 1; }
        }
        .anim-pop-in .overlay-content {
            animation: popIn var(--anim-duration, 1.2s) cubic-bezier(0.16,1,0.3,1);
        }

        /* NEW: neon-on — flickers on like a neon sign */
        @keyframes neonOn {
            0%   { opacity: 0; }
            5%   { opacity: 0.9; filter: brightness(1.8); }
            10%  { opacity: 0.1; }
            15%  { opacity: 1;   filter: brightness(1.4); }
            22%  { opacity: 0.4; }
            28%  { opacity: 1;   filter: brightness(1.6); }
            36%  { opacity: 0.7; filter: brightness(1.2); }
            50%  { opacity: 1;   filter: brightness(1);   }
            100% { opacity: 1;   filter: brightness(1);   }
        }
        .anim-neon-on .overlay-content {
            animation: neonOn var(--anim-duration, 2s) ease-in;
        }

        /* NEW: wipe-up — clip-path wipe from bottom */
        @keyframes wipeUp {
            from { clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); }
            to   { clip-path: polygon(0 0,    100% 0,    100% 100%, 0 100%); }
        }
        .anim-wipe-up .overlay-content {
            animation: wipeUp var(--anim-duration, 1.4s) cubic-bezier(0.16,1,0.3,1);
        }

        /* NEW: swoop-in — arcs in from bottom-left */
        @keyframes swoopIn {
            from { transform: translate(-200px, 150px) rotate(-8deg) scale(0.8); opacity: 0; }
            to   { transform: translate(0, 0)          rotate(0)     scale(1);   opacity: 1; }
        }
        .anim-swoop-in .overlay-content {
            animation: swoopIn var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        /* ─── Stagger / text animations — container fades quickly,
               individual text elements animate with delay ─────── */

        /* wave-in (existing) */
        @keyframes waveInEl {
            0%   { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0);     }
        }
        .anim-wave-in .overlay-content { animation: fadeIn 0.4s ease; }
        .anim-wave-in .church-label { animation: waveInEl var(--anim-duration, 1.6s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0s; }
        .anim-wave-in .main-title   { animation: waveInEl var(--anim-duration, 1.6s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.35s; }
        .anim-wave-in .subtitle     { animation: waveInEl var(--anim-duration, 1.6s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.7s; }
        .anim-wave-in .bible-verse  { animation: waveInEl var(--anim-duration, 1.6s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 1.0s; }

        /* NEW: cascade — each line drops in */
        .anim-cascade .overlay-content { animation: fadeIn 0.3s ease; }
        .anim-cascade .church-label { animation: dropIn var(--anim-duration, 0.7s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0s; }
        .anim-cascade .main-title   { animation: dropIn var(--anim-duration, 0.8s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0.2s; }
        .anim-cascade .subtitle     { animation: dropIn var(--anim-duration, 0.8s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0.42s; }
        .anim-cascade .bible-verse  { animation: dropIn var(--anim-duration, 0.8s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0.62s; }

        /* NEW: word-fly — lines fly in from the right */
        @keyframes flyRight {
            from { transform: translateX(100px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }
        .anim-word-fly .overlay-content { animation: fadeIn 0.3s ease; }
        .anim-word-fly .church-label { animation: flyRight var(--anim-duration, 0.7s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0s; }
        .anim-word-fly .main-title   { animation: flyRight var(--anim-duration, 0.7s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.2s; }
        .anim-word-fly .subtitle     { animation: flyRight var(--anim-duration, 0.7s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.4s; }
        .anim-word-fly .bible-verse  { animation: flyRight var(--anim-duration, 0.7s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.6s; }

        /* NEW: rise-up — lines rise from beneath */
        @keyframes riseUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .anim-rise-up .overlay-content { animation: fadeIn 0.3s ease; }
        .anim-rise-up .church-label { animation: riseUp var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0s; }
        .anim-rise-up .main-title   { animation: riseUp var(--anim-duration, 0.9s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.18s; }
        .anim-rise-up .subtitle     { animation: riseUp var(--anim-duration, 0.9s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.36s; }
        .anim-rise-up .bible-verse  { animation: riseUp var(--anim-duration, 0.9s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.54s; }

        /* Typewriter */
        .anim-typewriter .church-label,
        .anim-typewriter .main-title,
        .anim-typewriter .subtitle,
        .anim-typewriter .bible-verse { opacity: 0; }
        .anim-typewriter .church-label.tw-active,
        .anim-typewriter .main-title.tw-active,
        .anim-typewriter .subtitle.tw-active,
        .anim-typewriter .bible-verse.tw-active { opacity: 1; }
        .anim-typewriter .church-label.tw-active::after,
        .anim-typewriter .main-title.tw-active::after,
        .anim-typewriter .subtitle.tw-active::after,
        .anim-typewriter .bible-verse.tw-active::after {
            content: '|'; animation: blink 0.7s step-end infinite; margin-left: 2px;
        }
        .anim-typewriter .church-label.tw-done,
        .anim-typewriter .main-title.tw-done,
        .anim-typewriter .subtitle.tw-done,
        .anim-typewriter .bible-verse.tw-done { opacity: 1; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Glitch */
        @keyframes glitch {
            0%,100% { transform: translate(0); }
            20%     { transform: translate(-3px, 3px); }
            40%     { transform: translate(-3px,-3px); }
            60%     { transform: translate( 3px, 3px); }
            80%     { transform: translate( 3px,-3px); }
        }
        @keyframes glitchColor {
            0%,100% { text-shadow: 0 4px 12px rgba(0,0,0,0.4); }
            25%     { text-shadow: -3px 0 var(--accent-color), 3px 0 #3b82f6, 0 4px 12px rgba(0,0,0,0.4); }
            75%     { text-shadow:  3px 0 var(--accent-color),-3px 0 #3b82f6, 0 4px 12px rgba(0,0,0,0.4); }
        }
        .anim-glitch .overlay-content { animation: fadeIn 0.4s ease; }
        .anim-glitch .main-title {
            animation: glitch 0.35s ease-in-out 4, glitchColor 0.35s ease-in-out 4;
        }

        /* none */
        .anim-none .overlay-content { animation: none; }

        /* ──────────────────────────────────────────────────────────
           NEW ENTRANCE ANIMATIONS
        ────────────────────────────────────────────────────────── */

        /* elastic-in — spring bounce from below with rubbery overshoot */
        @keyframes elasticIn {
            0%   { transform: translateY(160px) scaleY(0.7); opacity: 0; }
            50%  { transform: translateY(-22px) scaleY(1.06); opacity: 1; }
            68%  { transform: translateY(10px)  scaleY(0.97); }
            82%  { transform: translateY(-6px)  scaleY(1.02); }
            92%  { transform: translateY(3px)   scaleY(0.99); }
            100% { transform: translateY(0)     scaleY(1);    opacity: 1; }
        }
        .anim-elastic-in .overlay-content {
            animation: elasticIn var(--anim-duration, 2.2s) cubic-bezier(0.16,1,0.3,1);
        }

        /* blur-in — materialises from a blurry haze */
        @keyframes blurIn {
            from { opacity: 0; filter: blur(24px); transform: scale(1.06); }
            to   { opacity: 1; filter: blur(0px);  transform: scale(1);    }
        }
        .anim-blur-in .overlay-content {
            animation: blurIn var(--anim-duration, 1.8s) cubic-bezier(0.16,1,0.3,1);
        }

        /* rise-shine — slides up with a radiant glow sweep */
        @keyframes riseShine {
            0%   { transform: translateY(80px); opacity: 0; filter: brightness(0.4); }
            50%  { filter: brightness(1.35); }
            100% { transform: translateY(0);   opacity: 1; filter: brightness(1); }
        }
        .anim-rise-shine .overlay-content {
            animation: riseShine var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        /* wipe-right — clip-path wipe from left to right */
        @keyframes wipeRight {
            from { clip-path: inset(0 100% 0 0); opacity: 0.6; }
            to   { clip-path: inset(0 0%   0 0); opacity: 1;   }
        }
        .anim-wipe-right .overlay-content {
            animation: wipeRight var(--anim-duration, 1.5s) cubic-bezier(0.16,1,0.3,1);
        }

        /* slam-in — crashes down from above with hard impact bounce */
        @keyframes slamIn {
            0%   { transform: translateY(-300px) scaleY(1.15); opacity: 0; }
            62%  { transform: translateY(14px) scaleY(0.93);   opacity: 1; }
            78%  { transform: translateY(-5px) scaleY(1.02); }
            90%  { transform: translateY(3px)  scaleY(0.99); }
            100% { transform: translateY(0)    scaleY(1);    }
        }
        .anim-slam-in .overlay-content {
            animation: slamIn var(--anim-duration, 1.4s) cubic-bezier(0.22,1,0.36,1);
        }

        /* morph-in — grows from a pill/oval shape */
        @keyframes morphIn {
            from { transform: scaleX(0.2) scaleY(0.6); opacity: 0; border-radius: 50%; }
            to   { transform: scaleX(1)   scaleY(1);   opacity: 1; border-radius: 24px; }
        }
        .anim-morph-in .overlay-content {
            animation: morphIn var(--anim-duration, 1.8s) cubic-bezier(0.16,1,0.3,1);
            transform-origin: left center;
        }

        /* stretch-in — accordion-style stretch from left */
        @keyframes stretchIn {
            0%   { transform: scaleX(0); opacity: 0; }
            55%  { transform: scaleX(1.04); opacity: 1; }
            75%  { transform: scaleX(0.98); }
            100% { transform: scaleX(1); opacity: 1; }
        }
        .anim-stretch-in .overlay-content {
            animation: stretchIn var(--anim-duration, 1.6s) cubic-bezier(0.16,1,0.3,1);
            transform-origin: left center;
        }

        /* spotlight — appears with a circular reveal + brightness burst */
        @keyframes spotlightReveal {
            0%   { clip-path: circle(0% at 50% 100%); opacity: 0; filter: brightness(2); }
            40%  { filter: brightness(1.4); }
            100% { clip-path: circle(150% at 50% 100%); opacity: 1; filter: brightness(1); }
        }
        .anim-spotlight .overlay-content {
            animation: spotlightReveal var(--anim-duration, 1.8s) cubic-bezier(0.16,1,0.3,1);
        }

        /* glide-in — smooth diagonal glide from bottom-right */
        @keyframes glideIn {
            from { transform: translate(120px, 60px) rotate(2deg); opacity: 0; }
            to   { transform: translate(0, 0)        rotate(0);    opacity: 1; }
        }
        .anim-glide-in .overlay-content {
            animation: glideIn var(--anim-duration, 2s) cubic-bezier(0.16,1,0.3,1);
        }

        /* unfold — unfolds vertically from the top edge */
        @keyframes unfold {
            from { transform: scaleY(0); opacity: 0.4; transform-origin: top; }
            to   { transform: scaleY(1); opacity: 1;   transform-origin: top; }
        }
        .anim-unfold .overlay-content {
            animation: unfold var(--anim-duration, 1.4s) cubic-bezier(0.16,1,0.3,1);
            transform-origin: bottom center;
        }

        /* iris-in — circular reveal from center */
        @keyframes irisIn {
            from { clip-path: circle(0%   at 50% 50%); opacity: 0.8; }
            to   { clip-path: circle(150% at 50% 50%); opacity: 1;   }
        }
        .anim-iris-in .overlay-content {
            animation: irisIn var(--anim-duration, 1.6s) cubic-bezier(0.16,1,0.3,1);
        }

        /* tv-on — like a CRT powering on: horizontal line expands to full */
        @keyframes tvOn {
            0%   { clip-path: inset(50% 5%); opacity: 0; filter: brightness(2.5); }
            30%  { clip-path: inset(48% 0%); opacity: 1; filter: brightness(1.6); }
            60%  { clip-path: inset(10% 0%); filter: brightness(1.2); }
            100% { clip-path: inset(0% 0%);  filter: brightness(1); }
        }
        .anim-tv-on .overlay-content {
            animation: tvOn var(--anim-duration, 1.8s) cubic-bezier(0.16,1,0.3,1);
        }

        /* ── New stagger / text animations ───────────────────────── */

        /* blur-reveal — each line blurs into clarity in sequence */
        @keyframes blurRevealEl {
            from { opacity: 0; filter: blur(18px); transform: scale(1.04); }
            to   { opacity: 1; filter: blur(0);    transform: scale(1); }
        }
        .anim-blur-reveal .overlay-content { animation: blurIn 0.3s ease; }
        .anim-blur-reveal .church-label { animation: blurRevealEl var(--anim-duration, 0.9s) ease backwards; animation-delay: 0s; }
        .anim-blur-reveal .main-title   { animation: blurRevealEl var(--anim-duration, 1.0s) ease backwards; animation-delay: 0.22s; }
        .anim-blur-reveal .subtitle     { animation: blurRevealEl var(--anim-duration, 1.0s) ease backwards; animation-delay: 0.44s; }
        .anim-blur-reveal .bible-verse  { animation: blurRevealEl var(--anim-duration, 1.0s) ease backwards; animation-delay: 0.66s; }

        /* neon-flicker — each element flickers on like neon gas */
        @keyframes neonFlickerEl {
            0%   { opacity: 0; }
            8%   { opacity: 1;   filter: brightness(2.2) drop-shadow(0 0 12px var(--accent-color)); }
            12%  { opacity: 0.2; }
            20%  { opacity: 1;   filter: brightness(1.6) drop-shadow(0 0 8px var(--accent-color)); }
            28%  { opacity: 0.5; }
            36%  { opacity: 1;   filter: brightness(1.4) drop-shadow(0 0 6px var(--accent-color)); }
            50%  { opacity: 0.8; filter: brightness(1.1); }
            70%  { opacity: 1;   filter: brightness(1); }
            100% { opacity: 1;   filter: brightness(1); }
        }
        .anim-neon-flicker .overlay-content { animation: fadeIn 0.2s ease; }
        .anim-neon-flicker .church-label { animation: neonFlickerEl var(--anim-duration, 2.2s) ease-in backwards; animation-delay: 0s; }
        .anim-neon-flicker .main-title   { animation: neonFlickerEl var(--anim-duration, 2.2s) ease-in backwards; animation-delay: 0.5s; }
        .anim-neon-flicker .subtitle     { animation: neonFlickerEl var(--anim-duration, 2.2s) ease-in backwards; animation-delay: 0.85s; }
        .anim-neon-flicker .bible-verse  { animation: neonFlickerEl var(--anim-duration, 2.2s) ease-in backwards; animation-delay: 1.1s; }

        /* stamp-in — each line stamps down like a rubber stamp */
        @keyframes stampEl {
            0%   { transform: scale(1.5) translateY(-10px); opacity: 0; filter: blur(4px); }
            55%  { transform: scale(0.96) translateY(2px);  opacity: 1; filter: blur(0); }
            75%  { transform: scale(1.02); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .anim-stamp-in .overlay-content { animation: fadeIn 0.3s ease; }
        .anim-stamp-in .church-label { animation: stampEl var(--anim-duration, 0.6s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0s; }
        .anim-stamp-in .main-title   { animation: stampEl var(--anim-duration, 0.7s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0.2s; }
        .anim-stamp-in .subtitle     { animation: stampEl var(--anim-duration, 0.7s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0.42s; }
        .anim-stamp-in .bible-verse  { animation: stampEl var(--anim-duration, 0.7s) cubic-bezier(0.22,1,0.36,1) backwards; animation-delay: 0.64s; }

        /* slide-alternate — odd lines from left, even from right */
        @keyframes slideFromLeft  { from { transform: translateX(-80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideFromRight { from { transform: translateX(80px);  opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .anim-slide-alternate .overlay-content { animation: fadeIn 0.3s ease; }
        .anim-slide-alternate .church-label { animation: slideFromLeft  var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0s; }
        .anim-slide-alternate .main-title   { animation: slideFromRight var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.2s; }
        .anim-slide-alternate .subtitle     { animation: slideFromLeft  var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.4s; }
        .anim-slide-alternate .bible-verse  { animation: slideFromRight var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.6s; }

        /* zoom-stagger — each line zooms in from 0 with stagger */
        @keyframes zoomStaggerEl {
            from { transform: scale(0.4); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .anim-zoom-stagger .overlay-content { animation: fadeIn 0.3s ease; }
        .anim-zoom-stagger .church-label { animation: zoomStaggerEl var(--anim-duration, 0.7s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0s; }
        .anim-zoom-stagger .main-title   { animation: zoomStaggerEl var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.18s; }
        .anim-zoom-stagger .subtitle     { animation: zoomStaggerEl var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.36s; }
        .anim-zoom-stagger .bible-verse  { animation: zoomStaggerEl var(--anim-duration, 0.8s) cubic-bezier(0.16,1,0.3,1) backwards; animation-delay: 0.54s; }

        /* word-by-word — JS driven, CSS handles visibility */
        .anim-word-by-word .overlay-content { animation: fadeIn 0.25s ease; }
        .anim-word-by-word .church-label,
        .anim-word-by-word .main-title,
        .anim-word-by-word .subtitle,
        .anim-word-by-word .bible-verse { opacity: 0; }
        .anim-word-by-word .church-label.tw-done,
        .anim-word-by-word .main-title.tw-done,
        .anim-word-by-word .subtitle.tw-done,
        .anim-word-by-word .bible-verse.tw-done { opacity: 1; }

        /* letter-drop — JS driven */
        .anim-letter-drop .overlay-content { animation: fadeIn 0.25s ease; }
        .anim-letter-drop .church-label,
        .anim-letter-drop .main-title,
        .anim-letter-drop .subtitle,
        .anim-letter-drop .bible-verse { opacity: 0; }
        .anim-letter-drop .church-label.tw-done,
        .anim-letter-drop .main-title.tw-done,
        .anim-letter-drop .subtitle.tw-done,
        .anim-letter-drop .bible-verse.tw-done { opacity: 1; }
        .letter-drop-char {
            display: inline-block;
            animation: letterDropChar 0.45s cubic-bezier(0.22,1,0.36,1) backwards;
        }
        @keyframes letterDropChar {
            from { transform: translateY(-40px) rotate(-8deg); opacity: 0; }
            to   { transform: translateY(0) rotate(0); opacity: 1; }
        }

        /* ═══════════════════════════════════════════════════════════
           EXIT ANIMATIONS
        ═══════════════════════════════════════════════════════════ */

        @keyframes fadeOutAnim {
            from { opacity: 1; transform: scale(1);    }
            to   { opacity: 0; transform: scale(0.94); }
        }
        .exit-fade-out-exit .overlay-content {
            animation: fadeOutAnim var(--exit-duration, 0.8s) ease-out forwards;
        }

        @keyframes slideDownExit {
            from { transform: translateY(0);    opacity: 1; }
            to   { transform: translateY(120px); opacity: 0; }
        }
        .exit-slide-down-exit .overlay-content {
            animation: slideDownExit var(--exit-duration, 0.8s) cubic-bezier(0.4,0,1,1) forwards;
        }

        @keyframes slideUpExit {
            from { transform: translateY(0);     opacity: 1; }
            to   { transform: translateY(-100px); opacity: 0; }
        }
        .exit-slide-up-exit .overlay-content {
            animation: slideUpExit var(--exit-duration, 0.8s) cubic-bezier(0.4,0,1,1) forwards;
        }

        @keyframes slideRightExit {
            from { transform: translateX(0);    opacity: 1; }
            to   { transform: translateX(200px); opacity: 0; }
        }
        .exit-slide-right-exit .overlay-content {
            animation: slideRightExit var(--exit-duration, 0.8s) cubic-bezier(0.4,0,1,1) forwards;
        }

        @keyframes zoomOutExit {
            from { transform: scale(1);   opacity: 1; }
            to   { transform: scale(0.7); opacity: 0; }
        }
        .exit-zoom-out-exit .overlay-content {
            animation: zoomOutExit var(--exit-duration, 0.8s) ease-out forwards;
        }

        @keyframes flipOutAnim {
            from { transform: perspective(800px) rotateX(0deg);  opacity: 1; }
            to   { transform: perspective(800px) rotateX(80deg); opacity: 0; }
        }
        .exit-flip-out-exit .overlay-content {
            animation: flipOutAnim var(--exit-duration, 0.8s) ease-out forwards;
        }

        @keyframes wipeOutAnim {
            from { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
            to   { clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%); }
        }
        .exit-wipe-out-exit .overlay-content {
            animation: wipeOutAnim var(--exit-duration, 0.8s) ease-out forwards;
        }

        @keyframes blurOutAnim {
            from { opacity: 1; filter: blur(0px);  transform: scale(1); }
            to   { opacity: 0; filter: blur(20px); transform: scale(1.06); }
        }
        .exit-blur-out-exit .overlay-content {
            animation: blurOutAnim var(--exit-duration, 0.8s) ease-in forwards;
        }

        @keyframes shrinkExit {
            from { transform: scaleY(1);   opacity: 1; }
            50%  { transform: scaleY(0.05) scaleX(1.4); opacity: 0.8; }
            to   { transform: scaleY(0)   scaleX(1.6); opacity: 0; }
        }
        .exit-shrink-exit .overlay-content {
            animation: shrinkExit var(--exit-duration, 0.7s) cubic-bezier(0.4,0,1,1) forwards;
        }

        @keyframes wipeLeftExit {
            from { clip-path: inset(0 0% 0 0); }
            to   { clip-path: inset(0 100% 0 0); }
        }
        .exit-wipe-left-exit .overlay-content {
            animation: wipeLeftExit var(--exit-duration, 0.8s) ease-in forwards;
        }

        @keyframes bounceOutExit {
            0%   { transform: translateY(0) scaleY(1); opacity: 1; }
            18%  { transform: translateY(-18px) scaleY(1.04); }
            50%  { transform: translateY(160px) scaleY(0.88); opacity: 0.4; }
            100% { transform: translateY(300px) scaleY(0.8); opacity: 0; }
        }
        .exit-bounce-out-exit .overlay-content {
            animation: bounceOutExit var(--exit-duration, 0.9s) cubic-bezier(0.4,0,1,1) forwards;
        }

        @keyframes spinOutExit {
            from { transform: rotate(0deg) scale(1); opacity: 1; }
            to   { transform: rotate(8deg) scale(0.8) translateY(80px); opacity: 0; }
        }
        .exit-spin-out-exit .overlay-content {
            animation: spinOutExit var(--exit-duration, 0.8s) ease-in forwards;
        }

        /* ─── Accent stripe pulse ───────────────────────────────── */
        @keyframes glowPulse {
            0%,100% { box-shadow: 0 0 20px rgba(var(--accent-rgb),0.3); }
            50%     { box-shadow: 0 0 40px rgba(var(--accent-rgb),0.6); }
        }
    </style>
</head>
<body>
    <div id="connection-status" class="connecting">Connecting...</div>

    <div id="lower-third" class="lower-third">
        <div class="background-shapes">
            <div class="shape-1"></div>
            <div class="shape-2"></div>
        </div>
        <div class="overlay-content">
            <div class="accent-stripe"></div>
            <div class="corner-decoration"></div>
            <div class="content-wrapper">
                <div class="church-label" id="church-info"></div>
                <!-- Main content area: minister name + title, OR secondary ticker message -->
                <div id="main-content-area" style="position:relative;">
                    <div id="primary-block">
                        <div class="main-title" id="main-title"></div>
                        <div class="subtitle"   id="subtitle"></div>
                    </div>
                    <div class="secondary-msg" id="secondary-msg" style="display:none;"></div>
                </div>
                <div class="bible-verse" id="bible-verse"></div>
            </div>
            <div class="bottom-glow"></div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════════
    // DOM REFS
    // ═══════════════════════════════════════════════════════════════════
    const lowerThird       = document.getElementById('lower-third');
    const churchInfo       = document.getElementById('church-info');
    const secondaryMsg     = document.getElementById('secondary-msg');
    const mainTitle        = document.getElementById('main-title');
    const subtitle         = document.getElementById('subtitle');
    const bibleVerse       = document.getElementById('bible-verse');
    const connectionStatus = document.getElementById('connection-status');

    // ═══════════════════════════════════════════════════════════════════
    // ANIMATION CATALOGUE
    //   base_ms: default CSS animation duration
    //   exit_ms: default exit animation duration
    // ═══════════════════════════════════════════════════════════════════
    const ANIMS = {
        // ── Container / entrance ──────────────────────────────────
        'slide-up':        { cls: 'anim-slide-up',        base_ms: 2000 },
        'fade-in':         { cls: 'anim-fade-in',         base_ms: 2000 },
        'slide-left':      { cls: 'anim-slide-left',      base_ms: 2000 },
        'slide-right':     { cls: 'anim-slide-right',     base_ms: 2000 },
        'slide-down':      { cls: 'anim-slide-down',      base_ms: 2000 },
        'zoom-in':         { cls: 'anim-zoom-in',         base_ms: 1800 },
        'bounce-in':       { cls: 'anim-bounce-in',       base_ms: 2400 },
        'rotate-in':       { cls: 'anim-rotate-in',       base_ms: 2200 },
        'reveal':          { cls: 'anim-reveal',          base_ms: 2200 },
        'flip-in':         { cls: 'anim-flip-in',         base_ms: 1600 },
        'drop-in':         { cls: 'anim-drop-in',         base_ms: 1800 },
        'split-in':        { cls: 'anim-split-in',        base_ms: 1400 },
        'pop-in':          { cls: 'anim-pop-in',          base_ms: 1200 },
        'neon-on':         { cls: 'anim-neon-on',         base_ms: 2000 },
        'wipe-up':         { cls: 'anim-wipe-up',         base_ms: 1400 },
        'swoop-in':        { cls: 'anim-swoop-in',        base_ms: 2000 },
        // ── New container / entrance ──────────────────────────────
        'elastic-in':      { cls: 'anim-elastic-in',      base_ms: 2200 },
        'blur-in':         { cls: 'anim-blur-in',         base_ms: 1800 },
        'rise-shine':      { cls: 'anim-rise-shine',      base_ms: 2000 },
        'wipe-right':      { cls: 'anim-wipe-right',      base_ms: 1500 },
        'slam-in':         { cls: 'anim-slam-in',         base_ms: 1400 },
        'morph-in':        { cls: 'anim-morph-in',        base_ms: 1800 },
        'stretch-in':      { cls: 'anim-stretch-in',      base_ms: 1600 },
        'spotlight':       { cls: 'anim-spotlight',       base_ms: 1800 },
        'glide-in':        { cls: 'anim-glide-in',        base_ms: 2000 },
        'unfold':          { cls: 'anim-unfold',          base_ms: 1400 },
        'iris-in':         { cls: 'anim-iris-in',         base_ms: 1600 },
        'tv-on':           { cls: 'anim-tv-on',           base_ms: 1800 },
        // ── Stagger text (existing) ───────────────────────────────
        'wave-in':         { cls: 'anim-wave-in',         base_ms: 1600 },
        'cascade':         { cls: 'anim-cascade',         base_ms:  800 },
        'word-fly':        { cls: 'anim-word-fly',        base_ms:  700 },
        'rise-up':         { cls: 'anim-rise-up',         base_ms:  800 },
        'glitch':          { cls: 'anim-glitch',          base_ms: 1400 },
        // ── Stagger text (new CSS) ────────────────────────────────
        'blur-reveal':     { cls: 'anim-blur-reveal',     base_ms: 1600 },
        'neon-flicker':    { cls: 'anim-neon-flicker',    base_ms: 2400 },
        'stamp-in':        { cls: 'anim-stamp-in',        base_ms:  900 },
        'slide-alternate': { cls: 'anim-slide-alternate', base_ms:  900 },
        'zoom-stagger':    { cls: 'anim-zoom-stagger',    base_ms:  900 },
        // ── JS-driven text animations ─────────────────────────────
        'typewriter':      { cls: 'anim-typewriter',      base_ms:    0 },
        'word-by-word':    { cls: 'anim-word-by-word',    base_ms:    0 },
        'letter-drop':     { cls: 'anim-letter-drop',     base_ms:    0 },
        'scramble':        { cls: 'anim-scramble',        base_ms:    0 },
        // ── No animation ─────────────────────────────────────────
        'none':            { cls: 'anim-none',            base_ms:    0 },
    };

    const EXIT_ANIMS = {
        'none':              { cls: null,                        ms: 0    },
        'fade-out-exit':     { cls: 'exit-fade-out-exit',       ms: 800  },
        'slide-down-exit':   { cls: 'exit-slide-down-exit',     ms: 800  },
        'slide-up-exit':     { cls: 'exit-slide-up-exit',       ms: 800  },
        'slide-right-exit':  { cls: 'exit-slide-right-exit',    ms: 800  },
        'zoom-out-exit':     { cls: 'exit-zoom-out-exit',       ms: 800  },
        'flip-out-exit':     { cls: 'exit-flip-out-exit',       ms: 800  },
        'wipe-out-exit':     { cls: 'exit-wipe-out-exit',       ms: 800  },
        'blur-out-exit':     { cls: 'exit-blur-out-exit',       ms: 800  },
        'shrink-exit':       { cls: 'exit-shrink-exit',         ms: 700  },
        'wipe-left-exit':    { cls: 'exit-wipe-left-exit',      ms: 800  },
        'bounce-out-exit':   { cls: 'exit-bounce-out-exit',     ms: 900  },
        'spin-out-exit':     { cls: 'exit-spin-out-exit',       ms: 800  },
    };

    const DEFAULT_POOL = ['slide-up','fade-in','slide-left','zoom-in','wave-in'];

    // ═══════════════════════════════════════════════════════════════════
    // RUNTIME STATE
    // ═══════════════════════════════════════════════════════════════════
    let currentState    = null;
    let currentVersion  = -1;

    // Rotation: chained setTimeout (so typewriter always completes first)
    let rotationTimer   = null;
    let rotationAborted = false;   // set true to cancel the current chain

    // Auto show/hide cycle
    let cycleDisplayTimer = null;
    let cycleHideTimer    = null;
    let cycleRunning      = false;

    // Typewriter
    let twTimeouts = [];

    // Scene-switch guard
    let sceneActive = false;

    // ═══════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════

    function hexToRgb(hex) {
        const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return r ? `${parseInt(r[1],16)}, ${parseInt(r[2],16)}, ${parseInt(r[3],16)}` : '16, 185, 129';
    }

    function applyColors(colors) {
        if (!colors) return;
        const ac  = colors.accent || '#10b981';
        const rgb = hexToRgb(ac);
        document.documentElement.style.setProperty('--accent-color', ac);
        document.documentElement.style.setProperty('--accent-rgb', rgb);

        const stripe = document.querySelector('.accent-stripe');
        if (stripe) stripe.style.background =
            `linear-gradient(180deg, ${ac} 0%, ${ac}dd 50%, ${ac}bb 100%)`;

        document.querySelectorAll('.shape-1, .shape-2').forEach((s, i) => {
            const op = i === 0 ? ['0.15','0.08'] : ['0.12','0.06'];
            s.style.background =
                `linear-gradient(135deg, rgba(${rgb},${op[0]}) 0%, rgba(${rgb},${op[1]}) 100%)`;
        });

        if (churchInfo) {
            churchInfo.style.color       = colors.church_label || ac;
            churchInfo.style.background  = `rgba(${rgb}, 0.1)`;
            churchInfo.style.borderColor = `rgba(${rgb}, 0.2)`;
        }
        if (mainTitle)  mainTitle.style.color  = colors.main_title || '#ffffff';
        if (subtitle)   subtitle.style.color   = colors.subtitle   || 'rgba(255,255,255,0.85)';
        if (bibleVerse) bibleVerse.style.color  = colors.verse      || ac;

        const cd = document.querySelector('.corner-decoration');
        if (cd) cd.style.background =
            `linear-gradient(135deg, rgba(${rgb},0.15) 0%, transparent 60%)`;

        const bg = document.querySelector('.bottom-glow');
        if (bg) bg.style.background =
            `linear-gradient(90deg, transparent 0%, ${ac} 20%, ${ac}dd 50%, ${ac} 80%, transparent 100%)`;
    }

    function applyContent(state) {
        mainTitle.textContent    = '';
        subtitle.textContent     = '';
        subtitle.style.display   = 'none';
        bibleVerse.textContent   = '';
        bibleVerse.style.display = 'none';
        // Hide ticker while we reset main content; ticker will restart via settle()
        secondaryMsg.style.display  = 'none';
        secondaryMsg.textContent    = '';
        secondaryMsg.style.fontSize = '';
        // Always restore primary block when applying new content
        if (primaryBlock) {
            primaryBlock.style.display     = 'block';
            primaryBlock.style.opacity     = '1';
            primaryBlock.style.visibility  = 'visible';
            primaryBlock.style.transition  = '';
        }

        if (state.church) {
            churchInfo.textContent  = (state.church.description && state.church.description.trim())
                ? state.church.name + ' \u2022 ' + state.church.description
                : state.church.name;
            churchInfo.style.display = 'inline-block';
        } else {
            churchInfo.style.display = 'none';
        }

        if (state.mode === 'minister' && state.minister) {
            mainTitle.textContent  = state.minister.name;
            subtitle.textContent   = state.minister.title || '';
            subtitle.style.display = state.minister.title ? 'block' : 'none';
        } else if (state.mode === 'sermon' && state.sermon) {
            mainTitle.textContent  = state.sermon.title;
            subtitle.textContent   = state.sermon.minister_name || '';
            subtitle.style.display = state.sermon.minister_name ? 'block' : 'none';
            if (state.sermon.bible_verse) {
                bibleVerse.textContent   = state.sermon.bible_verse;
                bibleVerse.style.display = 'block';
            }
        }
    }


    // ═══════════════════════════════════════════════════════════════════
    // TICKER ENGINE — Secondary / rotating messages under minister name
    // ═══════════════════════════════════════════════════════════════════

    let tickerTimer    = null;
    let tickerIndex    = 0;
    let tickerRunning  = false;
    let tickerMessages = [];

    // Map animation names → ticker enter CSS class (or special JS mode)
    const TICKER_ENTER_MAP = {
        // CSS-transition based
        'fade-in':         'tk-enter-fade',
        'slide-up':        'tk-enter-slide-up',
        'slide-down':      'tk-enter-slide-down',
        'slide-left':      'tk-enter-slide-left',
        'slide-right':     'tk-enter-slide-right',
        'zoom-in':         'tk-enter-zoom',
        'blur-in':         'tk-enter-blur',
        'blur-reveal':     'tk-enter-blur',
        'wipe-right':      'tk-enter-wipe-right',
        'elastic-in':      'tk-enter-elastic',
        'bounce-in':       'tk-enter-bounce',
        'flip-in':         'tk-enter-flip',
        'drop-in':         'tk-enter-drop',
        'pop-in':          'tk-enter-pop',
        'slam-in':         'tk-enter-slam',
        'rise-up':         'tk-enter-slide-up',
        'word-fly':        'tk-enter-slide-right',
        'slide-alternate': 'tk-enter-slide-left',
        'zoom-stagger':    'tk-enter-zoom',
        'cascade':         'tk-enter-drop',
        'neon-flicker':    'tk-enter-fade',
        // JS-driven (special modes handled in tickerShowOne)
        'typewriter':      '__typewriter__',
        'word-by-word':    '__word-by-word__',
        'letter-drop':     '__letter-drop__',
        'scramble':        '__scramble__',
        'glitch':          '__glitch__',
        'wave-in':         '__wave__',
        'stamp-in':        '__stamp__',
        // fallback
        'default':         'tk-enter-fade',
    };

    function tickerEnterClass(animName) {
        return TICKER_ENTER_MAP[animName] || TICKER_ENTER_MAP['default'];
    }

    // JS-driven ticker animation modes
    const TK_JS_MODES = new Set([
        '__typewriter__', '__word-by-word__', '__letter-drop__',
        '__scramble__', '__glitch__', '__wave__', '__stamp__'
    ]);

    function tickerPlayJS(mode, text, speed) {
        secondaryMsg.textContent = '';
        secondaryMsg.style.display = 'block';
        secondaryMsg.style.opacity = '1';

        if (mode === '__typewriter__') {
            secondaryMsg.className = 'secondary-msg tk-typewriter';
            let i = 0;
            const step = () => {
                if (!tickerRunning) return;
                if (i <= text.length) {
                    secondaryMsg.textContent = text.slice(0, i);
                    i++;
                    tickerTimer = setTimeout(step, speed);
                } else {
                    secondaryMsg.classList.add('tw-done');
                }
            };
            step();

        } else if (mode === '__word-by-word__') {
            secondaryMsg.className = 'secondary-msg';
            const words = text.split(' ');
            let built = '';
            let i = 0;
            const step = () => {
                if (!tickerRunning) return;
                if (i < words.length) {
                    built += (i > 0 ? ' ' : '') + words[i];
                    secondaryMsg.textContent = built;
                    i++;
                    tickerTimer = setTimeout(step, speed * 3.5);
                }
            };
            step();

        } else if (mode === '__letter-drop__') {
            secondaryMsg.className = 'secondary-msg';
            secondaryMsg.innerHTML = '';
            [...text].forEach((ch, i) => {
                const span = document.createElement('span');
                span.className = 'letter-drop-char';
                span.style.animationDelay = (i * (speed / 1000 * 0.8)) + 's';
                span.textContent = ch === ' ' ? '\u00a0' : ch;
                secondaryMsg.appendChild(span);
            });

        } else if (mode === '__scramble__') {
            secondaryMsg.className = 'secondary-msg';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';
            let iterations = 0;
            const maxIter = text.length * 3;
            const step = () => {
                if (!tickerRunning) return;
                secondaryMsg.textContent = text.split('').map((ch, i) => {
                    if (i < iterations / 3) return ch;
                    return ch === ' ' ? ' ' : chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                iterations++;
                if (iterations <= maxIter) tickerTimer = setTimeout(step, speed * 0.6);
                else secondaryMsg.textContent = text;
            };
            step();

        } else if (mode === '__glitch__') {
            secondaryMsg.className = 'secondary-msg';
            secondaryMsg.textContent = text;
            secondaryMsg.style.animation = 'glitch 1.4s ease forwards';
            setTimeout(() => {
                if (secondaryMsg) { secondaryMsg.style.animation = ''; secondaryMsg.textContent = text; }
            }, 1500);

        } else if (mode === '__wave__') {
            secondaryMsg.className = 'secondary-msg tk-wave';
            const words = text.split(' ');
            secondaryMsg.innerHTML = words.map((w, i) =>
                `<span class="tk-word" style="animation-delay:${i * 0.1}s">${w}</span>`
            ).join(' ');
            secondaryMsg.classList.add('tk-visible');

        } else if (mode === '__stamp__') {
            secondaryMsg.className = 'secondary-msg';
            secondaryMsg.textContent = text;
            secondaryMsg.style.transform = 'scale(1.5)';
            secondaryMsg.style.opacity = '0';
            secondaryMsg.getBoundingClientRect();
            secondaryMsg.style.transition = 'transform 0.25s cubic-bezier(0.22,1,0.36,1), opacity 0.2s ease';
            secondaryMsg.style.transform = 'scale(1)';
            secondaryMsg.style.opacity = '1';
        }
    }

    const primaryBlock = document.getElementById('primary-block');

    function stopTicker() {
        tickerRunning = false;
        if (tickerTimer) { clearTimeout(tickerTimer); tickerTimer = null; }
        // Snap secondary hidden
        secondaryMsg.className = 'secondary-msg';
        secondaryMsg.style.display = 'none';
        secondaryMsg.textContent = '';
        secondaryMsg.style.fontSize = '';
        // Restore primary block
        if (primaryBlock) {
            primaryBlock.style.display = 'block';
            primaryBlock.style.opacity = '1';
            primaryBlock.style.visibility = 'visible';
            primaryBlock.style.transition = '';
        }
    }

    function tickerShowOne(text, enterAnim, exitAnim, holdMs, onDone, twSpeed) {
        if (!tickerRunning) return;

        const enterMode = tickerEnterClass(enterAnim);
        const isJSMode  = TK_JS_MODES.has(enterMode);

        // Collapse primary block entirely
        if (primaryBlock) {
            primaryBlock.style.transition = 'opacity 0.25s ease';
            primaryBlock.style.opacity = '0';
            setTimeout(() => { if (primaryBlock) primaryBlock.style.display = 'none'; }, 260);
        }

        // Adaptive font size
        const len = text.length;
        let fs;
        if      (len <= 35)  fs = 'clamp(28px, 3.5vw, 50px)';
        else if (len <= 55)  fs = 'clamp(22px, 2.8vw, 40px)';
        else if (len <= 80)  fs = 'clamp(18px, 2.2vw, 32px)';
        else if (len <= 115) fs = 'clamp(14px, 1.7vw, 26px)';
        else                 fs = 'clamp(12px, 1.4vw, 22px)';
        secondaryMsg.style.fontSize = fs;
        secondaryMsg.style.color = mainTitle.style.color || '#ffffff';

        if (isJSMode) {
            // JS-driven: tickerPlayJS handles display itself
            tickerPlayJS(enterMode, text, twSpeed || 60);

            // Hold, then exit
            tickerTimer = setTimeout(() => {
                if (!tickerRunning) return;
                secondaryMsg.style.transition = 'opacity 0.4s ease';
                secondaryMsg.style.opacity = '0';
                tickerTimer = setTimeout(() => {
                    secondaryMsg.style.display = 'none';
                    secondaryMsg.style.opacity = '';
                    secondaryMsg.style.transition = '';
                    secondaryMsg.innerHTML = '';
                    secondaryMsg.textContent = '';
                    if (onDone) onDone();
                }, 420);
            }, holdMs);

        } else {
            // CSS-transition based
            secondaryMsg.className = 'secondary-msg ' + enterMode;
            secondaryMsg.textContent = text;
            secondaryMsg.style.display = 'block';

            // Force reflow then transition to visible
            secondaryMsg.getBoundingClientRect();
            secondaryMsg.style.transition = 'opacity 0.55s ease, transform 0.55s cubic-bezier(0.16,1,0.3,1), filter 0.55s ease, clip-path 0.55s ease';
            secondaryMsg.classList.add('tk-visible');

            // Hold, then exit
            tickerTimer = setTimeout(() => {
                if (!tickerRunning) return;
                secondaryMsg.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                secondaryMsg.classList.remove('tk-visible');
                secondaryMsg.classList.add('tk-exit');

                tickerTimer = setTimeout(() => {
                    secondaryMsg.classList.remove('tk-exit');
                    secondaryMsg.style.display = 'none';
                    if (onDone) onDone();
                }, 420);
            }, holdMs);
        }
    }

    /**
     * Start the ticker loop for a given state.
     * Respects: ticker_enabled, ticker_delay, ticker_duration,
     *           ticker_enter_animation, ticker_exit_animation,
     *           ticker_end_behavior, and per-message overrides.
     */
    function startTicker(state) {
        stopTicker();

        const s = state.animation_settings;
        if (!s || !s.ticker_enabled) return;

        const msgs = (state.mode === 'minister' && state.minister && state.minister.secondary_messages) || [];
        if (msgs.length === 0) return;

        // Sort by sort_order
        tickerMessages = [...msgs].sort((a, b) => a.sort_order - b.sort_order);
        tickerIndex    = 0;
        tickerRunning  = true;

        const globalDelay    = (s.ticker_delay  || 4)  * 1000;
        const globalDuration = (s.ticker_duration || 6) * 1000;
        const globalEnter    = s.ticker_enter_animation || 'fade-in';
        const globalExit     = s.ticker_exit_animation  || 'fade-out-exit';
        const endBehavior    = s.ticker_end_behavior    || 'loop';
        const twSpeed        = s.typewriter_speed        || 60;

        function runNext() {
            if (!tickerRunning) return;

            if (tickerIndex >= tickerMessages.length) {
                // End of cycle
                if (endBehavior === 'loop') {
                    tickerIndex = 0;
                    // Short pause before looping — primary stays hidden, no flash
                    tickerTimer = setTimeout(runNext, 600);
                } else if (endBehavior === 'main') {
                    // Restore primary subtitle, stop ticker
                    tickerRunning = false;
                    if (primaryBlock) {
                        primaryBlock.style.display = 'block';
                        primaryBlock.style.opacity = '0';
                        primaryBlock.getBoundingClientRect();
                        primaryBlock.style.transition = 'opacity 0.4s ease';
                        primaryBlock.style.opacity = '1';
                        setTimeout(() => { if (primaryBlock) primaryBlock.style.transition = ''; }, 420);
                    }
                } else {
                    // 'once' — hide secondary, keep primary hidden (played once, done)
                    tickerRunning = false;
                    secondaryMsg.style.display = 'none';
                    // Also restore primary so the overlay isn't blank
                    if (primaryBlock) {
                        primaryBlock.style.display = 'block';
                        primaryBlock.style.opacity = '0';
                        primaryBlock.getBoundingClientRect();
                        primaryBlock.style.transition = 'opacity 0.4s ease';
                        primaryBlock.style.opacity = '1';
                        setTimeout(() => { if (primaryBlock) primaryBlock.style.transition = ''; }, 420);
                    }
                }
                return;
            }

            const msg       = tickerMessages[tickerIndex];
            const holdMs    = (msg.display_duration != null ? msg.display_duration : s.ticker_duration || 6) * 1000;
            const enterAnim = msg.enter_animation || globalEnter;
            const exitAnim  = msg.exit_animation  || globalExit;

            tickerShowOne(msg.text, enterAnim, exitAnim, holdMs, () => {
                if (!tickerRunning) return;
                tickerIndex++;
                tickerTimer = setTimeout(runNext, 180);
            }, twSpeed);
        }

        // Wait for initial delay before first message
        tickerTimer = setTimeout(runNext, globalDelay);
    }

    function getAllAnimClasses() {
        return [
            ...Object.values(ANIMS).map(a => a.cls),
            ...Object.values(EXIT_ANIMS).map(a => a.cls),
        ].filter(Boolean);
    }

    function clearAnimClasses() {
        getAllAnimClasses().forEach(cls => lowerThird.classList.remove(cls));
    }

    function clearInlineStyles() {
        const oc = document.querySelector('.overlay-content');
        oc.style.transition = '';
        oc.style.transform  = '';
        oc.style.opacity    = '';
    }

    function getEffectiveDuration(name, settings) {
        const speed   = settings?.animation_speed || 1.0;
        const base_ms = ANIMS[name]?.base_ms ?? 2000;
        return Math.round(base_ms * speed);
    }

    function getExitDuration(exitName, settings) {
        const speed = settings?.animation_speed || 1.0;
        const base  = EXIT_ANIMS[exitName]?.ms ?? 800;
        return Math.round(base * speed);
    }

    function buildPool(settings) {
        if (!settings) return DEFAULT_POOL;
        const raw = settings.enabled_animations;
        if (!raw || raw.length === 0) return DEFAULT_POOL;
        const list = Array.isArray(raw) ? raw : raw.split(',');
        const clean = list.map(s => s.trim()).filter(s => s && ANIMS[s]);
        return clean.length > 0 ? clean : DEFAULT_POOL;
    }

    function pickRandom(pool, exclude) {
        const filtered = exclude ? pool.filter(a => a !== exclude) : pool;
        const src = filtered.length > 0 ? filtered : pool;
        return src[Math.floor(Math.random() * src.length)];
    }

    // ═══════════════════════════════════════════════════════════════════
    // TYPEWRITER — resolves only after ALL text is fully typed
    //              Speed respects animation_speed multiplier.
    // ═══════════════════════════════════════════════════════════════════

    function clearTwTimeouts() {
        twTimeouts.forEach(t => clearTimeout(t));
        twTimeouts = [];
    }

    function typewriterElement(el, text, msPerChar) {
        return new Promise(resolve => {
            el.textContent = '';
            el.classList.add('tw-active');
            el.classList.remove('tw-done');
            let i = 0;
            function tick() {
                if (i < text.length) {
                    el.textContent += text.charAt(i++);
                    twTimeouts.push(setTimeout(tick, msPerChar));
                } else {
                    el.classList.remove('tw-active');
                    el.classList.add('tw-done');
                    resolve();
                }
            }
            tick();
        });
    }

    // Returns a Promise that resolves when all elements are done typing.
    async function runTypewriter(settings) {
        clearTwTimeouts();
        [churchInfo, mainTitle, subtitle, bibleVerse].forEach(el => {
            el.classList.remove('tw-active', 'tw-done');
        });

        const speed    = settings?.animation_speed || 1.0;
        const baseMs   = settings?.typewriter_speed ?? 50;
        const msPerChar = Math.max(10, Math.round(baseMs * speed));

        const items = [];
        if (churchInfo.style.display !== 'none' && churchInfo.textContent)
            items.push({ el: churchInfo, text: churchInfo.textContent });
        if (mainTitle.textContent)
            items.push({ el: mainTitle,  text: mainTitle.textContent });
        if (subtitle.style.display !== 'none' && subtitle.textContent)
            items.push({ el: subtitle,   text: subtitle.textContent });
        if (bibleVerse.style.display !== 'none' && bibleVerse.textContent)
            items.push({ el: bibleVerse, text: bibleVerse.textContent });

        // Pre-clear all text so typewriter starts clean
        items.forEach(({ el }) => el.textContent = '');

        for (const { el, text } of items) {
            await typewriterElement(el, text, msPerChar);
        }
    }

    // ═══════════════════════════════════════════════════════════════════
    // SCRAMBLE text effect (JS-driven)
    // ═══════════════════════════════════════════════════════════════════

    const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    function scrambleElement(el, finalText, durationMs) {
        return new Promise(resolve => {
            el.style.opacity = '1';
            const steps    = Math.max(10, Math.ceil(durationMs / 40));
            let   step     = 0;
            const interval = setInterval(() => {
                const progress = step / steps;
                let out = '';
                for (let i = 0; i < finalText.length; i++) {
                    if (finalText[i] === ' ') { out += ' '; continue; }
                    if (i / finalText.length < progress) {
                        out += finalText[i];
                    } else {
                        out += SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
                    }
                }
                el.textContent = out;
                step++;
                if (step > steps) {
                    clearInterval(interval);
                    el.textContent = finalText;
                    resolve();
                }
            }, 40);
            twTimeouts.push(interval); // store so we can cancel
        });
    }

    async function runScramble(settings) {
        clearTwTimeouts();
        const speed    = settings?.animation_speed || 1.0;
        const durMs    = Math.round(1800 * speed);

        const items = [];
        if (churchInfo.style.display !== 'none' && churchInfo.textContent)
            items.push({ el: churchInfo, text: churchInfo.textContent });
        if (mainTitle.textContent)
            items.push({ el: mainTitle,  text: mainTitle.textContent });
        if (subtitle.style.display !== 'none' && subtitle.textContent)
            items.push({ el: subtitle,   text: subtitle.textContent });
        if (bibleVerse.style.display !== 'none' && bibleVerse.textContent)
            items.push({ el: bibleVerse, text: bibleVerse.textContent });

        // hide all, then scramble each with slight stagger
        items.forEach(({ el }) => { el.style.opacity = '0'; el.style.display = el.style.display || 'block'; });

        await new Promise(r => setTimeout(r, 50));
        for (const { el, text } of items) {
            el.textContent = text; // restore original (hidden) so scramble knows target
            scrambleElement(el, text, durMs); // fire without awaiting — run in parallel
        }
        // Wait for the longest scramble to finish
        await new Promise(r => setTimeout(r, durMs + 100));
    }

    // ═══════════════════════════════════════════════════════════════════
    // WORD-BY-WORD — pops each word in with a slight zoom+fade
    // ═══════════════════════════════════════════════════════════════════

    function wordByWordElement(el, text, msPerWord) {
        return new Promise(resolve => {
            const words = text.split(/(\s+)/);
            el.innerHTML = '';
            el.classList.remove('tw-done');
            el.style.opacity = '1';
            words.forEach(word => {
                const span = document.createElement('span');
                span.style.display = 'inline-block';
                span.style.opacity = '0';
                span.style.transform = 'scale(0.7) translateY(6px)';
                span.style.transition = 'opacity 0.28s ease, transform 0.28s cubic-bezier(0.16,1,0.3,1)';
                span.textContent = word;
                el.appendChild(span);
            });
            const spans = Array.from(el.querySelectorAll('span'));
            let i = 0;
            function showNext() {
                if (i >= spans.length) {
                    el.classList.add('tw-done');
                    el.innerHTML = text;
                    resolve();
                    return;
                }
                spans[i].style.opacity = '1';
                spans[i].style.transform = 'scale(1) translateY(0)';
                i++;
                twTimeouts.push(setTimeout(showNext, msPerWord));
            }
            twTimeouts.push(setTimeout(showNext, 40));
        });
    }

    async function runWordByWord(settings) {
        clearTwTimeouts();
        const speed    = settings?.animation_speed || 1.0;
        const baseMs   = settings?.typewriter_speed ?? 50;
        const msPerWord = Math.max(60, Math.round(baseMs * 2 * speed));

        const items = [];
        if (churchInfo.style.display !== 'none' && churchInfo.textContent)
            items.push({ el: churchInfo, text: churchInfo.textContent });
        if (mainTitle.textContent)
            items.push({ el: mainTitle,  text: mainTitle.textContent });
        if (subtitle.style.display !== 'none' && subtitle.textContent)
            items.push({ el: subtitle,   text: subtitle.textContent });
        if (bibleVerse.style.display !== 'none' && bibleVerse.textContent)
            items.push({ el: bibleVerse, text: bibleVerse.textContent });

        items.forEach(({ el }) => { el.style.opacity = '0'; });
        await new Promise(r => setTimeout(r, 40));
        for (const { el, text } of items) {
            await wordByWordElement(el, text, msPerWord);
        }
    }

    // ═══════════════════════════════════════════════════════════════════
    // LETTER-DROP — each character drops in from above, sequentially
    // ═══════════════════════════════════════════════════════════════════

    function letterDropElement(el, text, msPerChar) {
        return new Promise(resolve => {
            el.innerHTML = '';
            el.classList.remove('tw-done');
            el.style.opacity = '1';
            // Build spans for each character
            [...text].forEach(char => {
                const span = document.createElement('span');
                span.className = 'letter-drop-char';
                span.style.animationDelay = '9999s'; // hidden until we kick each one
                span.textContent = char === ' ' ? '\u00A0' : char;
                el.appendChild(span);
            });
            const chars = Array.from(el.querySelectorAll('.letter-drop-char'));
            let i = 0;
            function dropNext() {
                if (i >= chars.length) {
                    el.classList.add('tw-done');
                    // Flatten spans back to plain text after animation
                    setTimeout(() => { el.innerHTML = text; }, 500);
                    resolve();
                    return;
                }
                chars[i].style.animationDelay = '0s';
                i++;
                twTimeouts.push(setTimeout(dropNext, msPerChar));
            }
            twTimeouts.push(setTimeout(dropNext, 40));
        });
    }

    async function runLetterDrop(settings) {
        clearTwTimeouts();
        const speed    = settings?.animation_speed || 1.0;
        const baseMs   = settings?.typewriter_speed ?? 50;
        const msPerChar = Math.max(20, Math.round(baseMs * 0.8 * speed));

        const items = [];
        if (churchInfo.style.display !== 'none' && churchInfo.textContent)
            items.push({ el: churchInfo, text: churchInfo.textContent });
        if (mainTitle.textContent)
            items.push({ el: mainTitle,  text: mainTitle.textContent });
        if (subtitle.style.display !== 'none' && subtitle.textContent)
            items.push({ el: subtitle,   text: subtitle.textContent });
        if (bibleVerse.style.display !== 'none' && bibleVerse.textContent)
            items.push({ el: bibleVerse, text: bibleVerse.textContent });

        items.forEach(({ el }) => { el.style.opacity = '0'; });
        await new Promise(r => setTimeout(r, 40));
        for (const { el, text } of items) {
            await letterDropElement(el, text, msPerChar);
        }
    }

    // ═══════════════════════════════════════════════════════════════════
    // EXIT ANIMATION — plays, then calls onDone
    // ═══════════════════════════════════════════════════════════════════

    function playExit(exitName, settings, onDone) {
        const info = EXIT_ANIMS[exitName] || EXIT_ANIMS['fade-out-exit'];
        const dur  = getExitDuration(exitName, settings);

        document.documentElement.style.setProperty('--exit-duration', dur + 'ms');
        clearAnimClasses();

        if (!info.cls || exitName === 'none') {
            lowerThird.classList.remove('visible');
            clearAnimClasses();
            if (onDone) onDone();
            return;
        }

        lowerThird.classList.add(info.cls);
        setTimeout(() => {
            lowerThird.classList.remove('visible');
            clearAnimClasses();
            if (onDone) onDone();
        }, dur + 50);
    }

    // ═══════════════════════════════════════════════════════════════════
    // ENTRANCE — plays one named animation, returns Promise that resolves
    // when the animation (including typewriter / scramble) is COMPLETE.
    // ═══════════════════════════════════════════════════════════════════

    function playEntrance(name, settings) {
        return new Promise(resolve => {
            clearTwTimeouts();
            clearAnimClasses();
            clearInlineStyles();
            lowerThird.classList.remove('visible');

            const dur = getEffectiveDuration(name, settings);
            document.documentElement.style.setProperty('--anim-duration', dur + 'ms');

            setTimeout(() => {
                const info = ANIMS[name] || ANIMS['fade-in'];
                if (info.cls) lowerThird.classList.add(info.cls);
                lowerThird.classList.add('visible');

                if (name === 'typewriter') {
                    setTimeout(async () => {
                        await runTypewriter(settings);
                        resolve();
                    }, 80);
                } else if (name === 'word-by-word') {
                    setTimeout(async () => {
                        await runWordByWord(settings);
                        resolve();
                    }, 80);
                } else if (name === 'letter-drop') {
                    setTimeout(async () => {
                        await runLetterDrop(settings);
                        resolve();
                    }, 80);
                } else if (name === 'scramble') {
                    setTimeout(async () => {
                        await runScramble(settings);
                        resolve();
                    }, 80);
                } else {
                    // resolve after animation duration so rotation waits for it
                    setTimeout(resolve, Math.max(dur, 100));
                }
            }, 50);
        });
    }

    // ═══════════════════════════════════════════════════════════════════
    // ROTATION ENGINE — chained setTimeout (NOT setInterval)
    // Each call plays ONE animation, then schedules the next.
    // Aborted by setting rotationAborted=true before cancelling timer.
    // ═══════════════════════════════════════════════════════════════════

    function stopRotation() {
        rotationAborted = true;
        if (rotationTimer) { clearTimeout(rotationTimer); rotationTimer = null; }
        clearTwTimeouts();
    }

    let _lastRotationAnim = null;

    async function rotationTick(pool, intervalMs, settings) {
        if (rotationAborted) return;
        if (!currentState || currentState.mode === 'hidden') return;

        const name = pickRandom(pool, _lastRotationAnim);
        _lastRotationAnim = name;

        await playEntrance(name, settings);

        if (rotationAborted) return;

        // Schedule NEXT tick only AFTER this animation fully completed
        rotationTimer = setTimeout(() => {
            rotationTick(pool, intervalMs, settings);
        }, intervalMs);
    }

    function startRotation(settings, playNow) {
        stopRotation();

        if (!settings?.auto_rotate) return;
        if (!currentState || currentState.mode === 'hidden') return;

        const pool       = buildPool(settings);
        const intervalMs = Math.max((settings.rotation_interval || 8), 1) * 1000;

        rotationAborted = false;

        if (playNow) {
            // Kick off immediately
            rotationTick(pool, intervalMs, settings);
        } else {
            // Just schedule the first tick after one interval
            rotationTimer = setTimeout(() => {
                rotationTick(pool, intervalMs, settings);
            }, intervalMs);
        }
    }

    // ═══════════════════════════════════════════════════════════════════
    // AUTO SHOW/HIDE CYCLE
    // ═══════════════════════════════════════════════════════════════════

    function stopCycle() {
        cycleRunning = false;
        if (cycleDisplayTimer) { clearTimeout(cycleDisplayTimer); cycleDisplayTimer = null; }
        if (cycleHideTimer)    { clearTimeout(cycleHideTimer);    cycleHideTimer    = null; }
    }

    function startCycle(settings) {
        stopCycle();
        stopRotation();

        if (!settings?.auto_cycle) return;
        if (!currentState || currentState.mode === 'hidden') return;

        cycleRunning = true;

        const displayMs = Math.max((settings.display_duration || 30), 1) * 1000;
        const hideMs    = Math.max((settings.hide_duration    || 10), 1) * 1000;
        const enterAnim = settings.cycle_enter_animation || 'auto';
        const exitAnim  = settings.cycle_exit_animation  || 'fade-out-exit';

        // Show phase
        function showPhase() {
            if (!cycleRunning) return;
            const pool = buildPool(settings);
            const anim = (enterAnim === 'auto') ? pickRandom(pool) : (ANIMS[enterAnim] ? enterAnim : pickRandom(pool));

            playEntrance(anim, settings).then(() => {
                if (!cycleRunning) return;
                // Start rotation during display phase
                if (settings.auto_rotate) startRotation(settings, false);
                // Schedule hide
                cycleDisplayTimer = setTimeout(() => {
                    if (!cycleRunning) return;
                    stopRotation();
                    playExit(exitAnim, settings, () => {
                        if (!cycleRunning) return;
                        // Hide phase
                        cycleHideTimer = setTimeout(() => {
                            if (!cycleRunning) return;
                            showPhase();
                        }, hideMs);
                    });
                }, displayMs);
            });
        }

        showPhase();
    }

    // ═══════════════════════════════════════════════════════════════════
    // SCENE SWITCH — smooth content crossfade while overlay stays visible
